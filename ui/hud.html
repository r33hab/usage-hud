  add.onclick = () => openPalette(add, (make) => { const added = make(); (card.rows = card.rows || []).push(added); state.selected = added; commit(); document.querySelector(".wrap.selected")?.scrollIntoView({ block: "nearest" }); });
  bar.appendChild(el("span", "cardedit-title", card.rows?.find(s => s.type === "header")?.title || card.id || "Card"));
  bar.appendChild(add);

  const color = el("input");
  color.type = "color";
  color.value = card.accent || "#e08a63";
  color.title = "accent colour";
  color.setAttribute("aria-label", "Card accent colour");
  color.addEventListener("input", () => {
    card.accent = color.value;
    color.closest(".card").style.setProperty("--accent", color.value);
    save();
  });
  bar.appendChild(color);

  const up = el("button", "mini", "↑");
  up.title = "move this whole card up";
  up.disabled = index === 0;
  up.onclick = () => { moveCard(index, -1); commit(); };
  const down = el("button", "mini", "↓");
  down.title = "move this whole card down";
  down.disabled = index === state.config.cards.length - 1;
  down.onclick = () => { moveCard(index, 1); commit(); };
  bar.append(up, down);

  const eye = el("button", "mini", card.enabled === false ? "hidden" : "shown");
  eye.title = "show or hide this whole card";
  eye.onclick = () => { card.enabled = card.enabled === false; commit(); };
  bar.appendChild(eye);


  const pal = el("div", "palette");
  pal.id = "pal-" + index;
  bar.appendChild(pal);
  return bar;
}

let openPaletteEl = null;
function openPalette(anchor, onPick, targetCard) {
  const card = anchor.closest(".card") || [...document.querySelectorAll(".card")].find(c => c.querySelector(".rows").__card === targetCard);
  let pal = card.querySelector(".palette");
  const wasOpen = pal.classList.contains("open") && openPaletteEl === pal;
  if (openPaletteEl && openPaletteEl !== pal) openPaletteEl.classList.remove("open");
  pal.innerHTML = "";
  PALETTE.forEach((p) => {
    const b = el("button", "mini", p.label);
    const t = TYPES[p.type];
    if (t) b.title = t.label + ": " + t.desc;
    b.onclick = () => { pal.classList.remove("open"); onPick(p.make); };
    pal.appendChild(b);
  });
  pal.classList.toggle("open", !wasOpen);
  if (!wasOpen) pal.scrollIntoView({ block: "nearest" });
  anchor.classList.toggle("armed", pal.classList.contains("open"));
  openPaletteEl = pal;
  reportHeight();
}

/// Every component lives in exactly one list: a card's rows, or a container's
/// items. Finding that list lets the move buttons edit the config directly
/// instead of simulating a drag.
function locate(spec) {
  const cards = state.config.cards;
  const search = (list, parent, card, cardIndex) => {
    if (!Array.isArray(list)) return null;
    const i = list.indexOf(spec);
    if (i >= 0) return { list, index: i, parent, card, cardIndex };
    for (const s of list) {
      const r = search(s.items, s, card, cardIndex);
      if (r) return r;
    }
    return null;
  };
  for (let ci = 0; ci < cards.length; ci++) {
    const found = search(cards[ci].rows, null, cards[ci], ci);
    if (found) return found;
  }
  return null;
}

/// One step up or down. At the edge of a side-by-side row the component steps
/// out of it; at the edge of a card it moves to the neighbouring card, landing
/// under that card's header rather than above it. Returns false when there is
/// nowhere left to go, which is what greys the button out. `dry` asks the
/// question without moving anything.
function nudge(spec, dir, dry) {
  const loc = locate(spec);
  if (!loc) return false;

  const target = loc.index + dir;
  if (target >= 0 && target < loc.list.length) {
    if (!dry) {
      loc.list.splice(loc.index, 1);
      loc.list.splice(target, 0, spec);
    }
    return true;
  }

  if (loc.parent) {
    const outer = locate(loc.parent);
    if (!outer) return false;
    if (!dry) {
      loc.list.splice(loc.index, 1);
      outer.list.splice(outer.index + (dir > 0 ? 1 : 0), 0, spec);
    }
    return true;
  }

  const next = state.config.cards[loc.cardIndex + dir];
  if (!next) return false;
  if (!dry) {
    loc.list.splice(loc.index, 1);
    next.rows = next.rows || [];
    const under = next.rows[0] && next.rows[0].type === "header" ? 1 : 0;
    next.rows.splice(dir > 0 ? under : next.rows.length, 0, spec);
  }
  return true;
}

function moveCard(index, delta) {
  const cards = state.config.cards;
  const to = index + delta;
  if (to < 0 || to >= cards.length) return;
  const [c] = cards.splice(index, 1);
  cards.splice(to, 0, c);
}

function removeSpec(spec) {
  const strip = (list) => {
    if (!Array.isArray(list)) return;
    const i = list.indexOf(spec);
    if (i >= 0) { list.splice(i, 1); return; }
    list.forEach((s) => { strip(s.items); });
  };
  state.config.cards.forEach((c) => strip(c.rows));
}

// ================================================================== dragging

let drag = null;
let dragFrame = 0;
function scrollWhileDragging() {
  if (!drag) return;
  const host = $("cards"), r = host.getBoundingClientRect();
  const p = drag.point;
  if (p && p.clientX >= r.left && p.clientX <= r.right) {
    const distance = p.clientY < r.top + 30 ? -7 : p.clientY > r.bottom - 30 ? 7 : 0;
    const before = host.scrollTop;
    host.scrollTop += distance;
    if (host.scrollTop !== before) onDragMove(p);
  }
  dragFrame = requestAnimationFrame(scrollWhileDragging);
}

function beginDrag(e, wrap) {
  if (e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  drag = { wrap, spec: wrap.__spec, point: e };
  dragFrame = requestAnimationFrame(scrollWhileDragging);
  wrap.classList.add("dragging");
  state.selected = wrap.__spec;
  window.addEventListener("mousemove", onDragMove);
  window.addEventListener("mouseup", endDrag, { once: true });
}

/// A component can be dropped in any card and inside any side-by-side row. The
/// refusals are the ones with no useful meaning: a container inside itself, and
/// a card header or a row nested inside another row.
function zoneAccepts(zone, spec) {
  if (drag.wrap.contains(zone)) return false;
  if (zone.dataset.dropzone === "nested" && (spec.type === "row" || spec.type === "header")) return false;
  return true;
}

const clearHot = () => document.querySelectorAll(".zone-hot").forEach((z) => z.classList.remove("zone-hot"));

function onDragMove(e) {
  if (!drag) return;
  drag.point = e;

  // The innermost container under the cursor takes the drop, so hovering a row
  // that sits inside a card means the row, not the card.
  let zone = null;
  let area = Infinity;
  for (const z of document.querySelectorAll("[data-dropzone]")) {
    if (!zoneAccepts(z, drag.spec)) continue;
    const r = z.getBoundingClientRect();
    const pad = z.children.length ? 2 : 8;   // an empty container needs a bigger target
    if (e.clientX < r.left - pad || e.clientX > r.right + pad) continue;
    if (e.clientY < r.top - pad || e.clientY > r.bottom + pad) continue;
    const a = Math.max(1, r.width) * Math.max(1, r.height);
    if (a < area) { zone = z; area = a; }
  }
  clearHot();
  if (!zone) return;
  zone.classList.add("zone-hot");

  // Hit-test on the axis the container is actually laid out on. Editing stacks
  // side-by-side rows, so this is vertical there; were it not, every item in a
  // row would share one vertical band and reordering would be impossible.
  const box = getComputedStyle(zone);
  const across = box.display.includes("flex") && box.flexDirection.startsWith("row");
  let before = null;
  for (const kid of zone.children) {
    if (kid === drag.wrap || !kid.classList.contains("wrap")) continue;
    const r = kid.getBoundingClientRect();
    const mid = across ? r.left + r.width / 2 : r.top + r.height / 2;
    if ((across ? e.clientX : e.clientY) < mid) { before = kid; break; }
  }
  if (zone !== drag.wrap.parentNode || before !== drag.wrap.nextSibling) zone.insertBefore(drag.wrap, before);
}

function endDrag() {
  if (!drag) return;
  cancelAnimationFrame(dragFrame);
  drag.wrap.classList.remove("dragging");
  clearHot();
  window.removeEventListener("mousemove", onDragMove);
  drag = null;
  commitOrderFromDom();
  save();
  buildLayout();
}

/// Reads the DOM back into the config. Every wrapper carries its own spec, so
/// order (including moves between cards) falls out of the tree as it now stands.
/// Anything the DOM has managed to lose is put back where it came from rather
/// than being dropped - a reorder must never be able to delete a component.
function commitOrderFromDom() {
  const owners = new Map();          // spec -> the card it belonged to
  const collect = (list, card, into) => {
    for (const spec of list || []) {
      into.add(spec);
      if (card) owners.set(spec, card);
      collect(spec.items, card, into);
    }
  };

  const before = new Set();
  state.config.cards.forEach((c) => collect(c.rows, c, before));

  document.querySelectorAll('[data-dropzone="top"]').forEach((host) => {
    if (host.__card) host.__card.rows = [...host.children].filter((c) => c.__spec).map((c) => c.__spec);
  });
  document.querySelectorAll('[data-dropzone="nested"]').forEach((host) => {
    const owner = host.closest(".wrap");
    if (owner && owner.__spec) owner.__spec.items = [...host.children].filter((c) => c.__spec).map((c) => c.__spec);
  });

  const after = new Set();
  state.config.cards.forEach((c) => collect(c.rows, null, after));

  const orphans = [...before].filter((spec) => !after.has(spec));
  for (const spec of orphans) {
    const card = owners.get(spec) || state.config.cards[0];
    if (card) (card.rows = card.rows || []).push(spec);
  }
  if (orphans.length) {
    console.warn("usage-hud: " + orphans.length + " component(s) fell out of the DOM during a drag; restored");
  }
}

// ==================================================================== drawer

function buildDrawer() {
  if (state.tab === "saved") return buildSaved();
  const host = $("drawer");
  host.innerHTML = "";
  const t = state.config.theme;

  // Every setting says what it does. The drawer is only open when someone is
  // trying to change something, so the words are never in the way.
  const field = (name, control, valueEl, hint) => {
    const f = el("div", "field");
    const label = el("label", "fname", name[0].toUpperCase() + name.slice(1));
    control.id = "appearance-" + name;
    if (control.matches("input, select")) label.htmlFor = control.id;
    else { control.setAttribute("role", "group"); control.setAttribute("aria-label", name); }
    f.append(label, control, valueEl || el("span", "fval", ""));
    if (hint) f.appendChild(el("div", "fhint", hint));
    host.appendChild(f);
    return f;
  };

  const seg = (options, current, onPick) => {
    const box = el("div", "seg");
    options.forEach((o) => {
      const b = el("button", current === o ? "sel" : null, o);
      b.setAttribute("aria-pressed", String(current === o));
      b.onclick = () => { onPick(o); };
      box.appendChild(b);
    });
    return box;
  };

  field("theme", seg(["auto", "dark", "light"], t.scheme, (v) => { t.scheme = v; applyTheme(); save(); buildDrawer(); }),
    null, "auto follows the macOS appearance.");
  field("density", seg(["compact", "normal", "roomy"], t.density, (v) => { t.density = v; applyTheme(); save(); buildDrawer(); }),
    null, "Adjust text size and space between components.");

  // What the collapse button leaves behind. "bars" is the point of the panel;
  // the rest is detail you can open up again with the same button.
  field("minimised", seg(["bars", "headers", "both"], t.collapsedMode || "bars", (v) => {
    t.collapsedMode = v; state.previewCollapsed = true; applyTheme(); save(); buildDrawer();
  }), null, "Choose what remains when you minimise the HUD. Active quota alerts always stay visible.");

  /// `live: false` defers the effect to mouse-up. Width needs that: the panel is
  /// right-anchored, so resizing mid-drag slides this very slider out from under
  /// the cursor and the drag falls apart. The readout still tracks live.
  const slider = (key, min, max, step, unit, opts = {}) => {
    const r = el("input");
    r.type = "range";
    r.min = min; r.max = max; r.step = step;
    // The stored value is in real units (opacity is a 0-1 fraction); the slider
    // works in display units (40-100). Scale up going in, or the thumb pins to
    // the min while the readout shows the true value.
    const scale = opts.scale || 1;
    r.value = t[key] * scale;
    const out = el("span", "fval", Math.round(t[key] * scale) + unit);

    const commit = () => {
      if (opts.onLive) opts.onLive();
      pushTheme();
      save();
    };
    r.addEventListener("input", () => {
      t[key] = Number(r.value) / scale;
      out.textContent = r.value + unit;
      if (opts.live !== false) commit();
      else syncLivePreview();
    });
    // Fires on mouse-up, and on every arrow-key step, so deferred controls stay
    // keyboard-adjustable.
    r.addEventListener("change", () => {
      t[key] = Number(r.value) / scale;
      out.textContent = r.value + unit;
      commit();
    });
    r.addEventListener("mousedown", (e) => e.stopPropagation());
    return [r, out];
  };

  field("width", ...slider("width", 300, 620, 2, "px", { live: false }),
    "Your HUD width after Done. The customization window stays steady.");
  field("opacity", ...slider("opacity", 40, 100, 1, "%", { scale: 100, onLive: applyTheme }),
    "Background transparency. Text stays fully visible.");
  field("radius", ...slider("radius", 0, 26, 1, "px", { onLive: applyTheme }), "corner rounding.");

  field("vibrancy", picker(
    [["hudWindow", "hud", "the darkest, most neutral blur - the default"],
     ["popover", "popover", "lighter, like a macOS popover"],
     ["sidebar", "sidebar", "the Finder sidebar material"],
     ["menu", "menu", "the menu material"],
     ["toolTip", "tooltip", "the tooltip material"],
     ["underWindowBackground", "under window", "very heavily blurred"],
     ["fullScreenUI", "fullscreen", "the material full-screen overlays use"],
     ["contentBackground", "content", "flattest, closest to an opaque window"]],
    t.vibrancy, (v) => { t.vibrancy = v; pushTheme(); save(); },
    "which macOS blur material sits behind the panel"),
    null, "the macOS blur behind the panel. It samples your wallpaper, so the effect depends on what is behind it.");

  const interval = picker(
    [["15", "15s"], ["30", "30s"], ["60", "1m"], ["120", "2m"], ["300", "5m"], ["900", "15m"]],
    String(state.config.refreshSeconds), (v) => { state.config.refreshSeconds = Number(v); save(); },
    "how often the logs are re-read");
  field("refresh", interval, null, "How often local usage is refreshed. Live quota updates at most every two minutes.");

  const foot = el("div", "drawerfoot");
  const resetTheme = el("button", "mini", "reset appearance");
  resetTheme.title = "put theme, density, size and minimised mode back to the shipped default";
  resetTheme.onclick = () => {
    Object.assign(t, { scheme: "auto", density: "normal", width: 380, opacity: 1, radius: 14, vibrancy: "hudWindow", collapsedMode: "bars" });
    applyTheme(); pushTheme(); save(); buildDrawer();
  };
  const openFile = el("button", "mini", "open config file");
  openFile.title = "open ~/.config/usage-hud/config.json - every setting here lives in that file";
  openFile.onclick = () => bridge({ action: "openConfig" });
  foot.append(resetTheme, openFile);
  host.appendChild(foot);
}

// ============================================================ saved configs

/// A saved config is the editor's own work under a name: layout, appearance
/// and refresh interval. Machine settings stay out of it, so loading one never
/// changes calibrated caps, hotkeys or pricing.
const savedPart = (config) => JSON.parse(JSON.stringify({
  cards: config.cards, theme: config.theme, refreshSeconds: config.refreshSeconds,
}));
const sameName = (a, b) => a.toLowerCase() === b.toLowerCase();

function applySavedConfig(name) {
  const entry = state.saved.find((s) => s.name === name);
  if (!entry || !state.config) return false;
  const c = entry.config || {};
  const next = JSON.parse(JSON.stringify(state.config));
  if (Array.isArray(c.cards)) next.cards = JSON.parse(JSON.stringify(c.cards));
  // Minimised is where the panel is right now, not part of a look.
  if (c.theme && typeof c.theme === "object") next.theme = { ...next.theme, ...c.theme, collapsed: next.theme.collapsed };
  if (Number.isFinite(c.refreshSeconds)) next.refreshSeconds = c.refreshSeconds;
  state.config = next;
  state.selected = null;
  applyTheme(); pushTheme(); buildLayout();
  if (state.drawer) buildDrawer();
  save();
  return true;
}

function buildSaved() {
  const host = $("drawer");
  const draft = $("saved-name") ? $("saved-name").value : "";
  host.innerHTML = "";

  const form = el("div", "field");
  const label = el("label", "fname", "Name");
  const input = el("input");
  input.type = "text";
  input.id = label.htmlFor = "saved-name";
  input.maxLength = 60;
  input.placeholder = "Work, Minimal, Big numbers...";
  input.value = draft;
  const store = el("button", "mini", "Save");
  store.title = "save the current layout and appearance under this name";
  const submit = () => {
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    const config = savedPart(state.config);
    bridge({ action: "saveNamedConfig", name, config });
    // The native side answers with the stored list; until then, show this one.
    state.saved = [...state.saved.filter((s) => !sameName(s.name, name)), { name, savedAt: new Date().toISOString(), config }]
      .sort((a, b) => a.name.localeCompare(b.name));
    input.value = "";
    buildSaved();
  };
  store.onclick = submit;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
  form.append(label, input, store);
  form.appendChild(el("div", "fhint", "Saves the current layout, appearance and refresh interval. Saving under an existing name replaces it. Calibrated caps, hotkeys and pricing stay as they are when you load one."));
  host.appendChild(form);

  if (!state.saved.length) {
    host.appendChild(el("p", "saved-empty", "No saved configs yet. The right-click menu's Saved Configs switches between them without opening the editor."));
    return;
  }
  for (const entry of state.saved) {
    const row = el("div", "saved-row");
    const text = el("div", "saved-text");
    text.append(el("div", "saved-name", entry.name));
    const when = entry.savedAt ? new Date(entry.savedAt) : null;
    if (when && !isNaN(when)) text.appendChild(el("div", "saved-date", "saved " + when.toLocaleString([], { dateStyle: "medium", timeStyle: "short" })));
    const load = el("button", "mini", "Load");
    load.title = "replace the current layout and appearance with this one; Undo last change brings the current one back";
    load.onclick = () => applySavedConfig(entry.name);
    const del = el("button", "mini danger", "Delete");
    del.title = "delete this saved config; click twice, it cannot be undone";
    let disarm = null;
    del.onclick = () => {
      if (!del.classList.contains("armed")) {
        del.classList.add("armed");
        del.textContent = "Confirm delete";
        disarm = setTimeout(() => { del.classList.remove("armed"); del.textContent = "Delete"; }, 3000);
        return;
      }
      clearTimeout(disarm);
      bridge({ action: "deleteNamedConfig", name: entry.name });
      state.saved = state.saved.filter((s) => s.name !== entry.name);
      buildSaved();
    };
    row.append(text, load, del);
    host.appendChild(row);
  }
}

// =================================================================== history
// Week by week and month by month, one click from the panel: the bar-chart
// button in the title bar, a click on any big number, sparkline or history
// list (the view opens on what that component shows), or Usage History… in the
// right-click menu. Bars give each period; the overlay lays the periods over
// each other as running totals, so this week reads against last week and a
// typical one at the same point. The view takes the cards' place and the title
// bar stays, so the way back is where the way in was. Its choices are a viewer
// convenience, kept in the web view's storage rather than the config file.

const HISTORY_TYPES = new Set(["headline", "spark", "months"]);
const HISTORY_HINT = "Click for its history, week by week or month by month.";
const HISTORY_PREFS = "usage-hud.history";
const HISTORY_UNITS = {
  week:  { label: "Weeks",  list: "weeks",  one: "week",  plural: "weeks" },
  month: { label: "Months", list: "months", one: "month", plural: "months" },
};
const HISTORY_ACCENT = { claude: "#e08a63", codex: "#3ecfa0" };
// Claude counts requests where Codex counts turns, and so on: switching
// provider keeps the nearest quantity.
const HISTORY_TWIN = { reqs: "turns", turns: "reqs", cacheRead: "cached", cached: "cacheRead" };
const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

state.history = { open: false, provider: "claude", key: "cost", per: "week", view: "bars", hover: null, model: null };
try {
  const kept = JSON.parse(localStorage.getItem(HISTORY_PREFS) || "null") || {};
  for (const k of ["provider", "key", "per", "view"]) if (typeof kept[k] === "string") state.history[k] = kept[k];
} catch (e) { /* no storage in this web view: the defaults */ }

function rememberHistory() {
  const { provider, key, per, view } = state.history;
  try { localStorage.setItem(HISTORY_PREFS, JSON.stringify({ provider, key, per, view })); } catch (e) { /* not kept */ }
}

const quantityOf = (provider, key) => QUANTITIES[provider]?.find(([k]) => k === key);

/// What a click on a component opens the history on: its provider and
/// quantity, by month when it shows a month and by week otherwise.
function historyFocus(spec, card) {
  const monthly = new Set(["monthly", "lastMonth", "12mo"]);
  if (spec?.type === "months") {
    const src = historyList(spec)[spec.source];
    if (src) return { provider: src.provider, key: src.key, per: src.per };
  }
  const item = spec?.type === "headline" ? METRICS[spec.metric] : spec?.type === "spark" ? SERIES[spec.series] : null;
  if (item?.family) {
    const [provider, key] = item.family.split(".");
    return { provider, key, per: monthly.has(item.period) ? "month" : "week" };
  }
  return PROVIDERS[card?.id] ? { provider: card.id } : {};
}

function openHistory(focus = {}) {
  if (!state.config || state.customizing) return;
  const h = state.history;
  const switching = focus.provider && focus.provider !== h.provider;
  Object.assign(h, focus, { open: true, hover: null });
  if (switching && !focus.key && !quantityOf(h.provider, h.key)) h.key = HISTORY_TWIN[h.key] || "cost";
  rememberHistory();
  document.body.classList.add("history");
  $("b-history").classList.add("on");
  $("b-history").setAttribute("aria-pressed", "true");
  // Minimised is suspended while the history is open, the way editing does.
  applyTheme();
  renderHistory();
  $("history").scrollTop = 0;
}

function closeHistory() {
  if (!state.history.open) return;
  state.history.open = false;
  state.history.model = null;
  document.body.classList.remove("history");
  $("b-history").classList.remove("on");
  $("b-history").setAttribute("aria-pressed", "false");
  $("history").replaceChildren();
  applyTheme();
}

const dayIndex = (sec, startSec) => Math.round((sec - startSec) / 86400);
const periodLength = (per, startSec) => {
  if (per === "week") return 7;
  const d = new Date(startSec * 1000);
  return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
};
const mean = (list) => (list.length ? list.reduce((n, v) => n + v, 0) / list.length : null);

/// Adds every count in `bin` to `acc`, `f` times over.
function sumBins(acc, bin, f = 1) {
  for (const [k, v] of Object.entries(bin)) if (k !== "start" && typeof v === "number") acc[k] = (acc[k] || 0) + v * f;
  return acc;
}

/// A period's running total, one point per midnight: x = 0 where it begins and
/// x = n at the end of its nth day. The period under way stops at now, part-way
/// through today. Null when the days do not reach back to its start. A rate
/// (cache hit) runs as the rate so far, not as a sum.
function runningCurve(provider, key, period, per, days, nowSec) {
  if (!days.length || days[0].start > period.start + 3600) return null;
  const length = periodLength(per, period.start);
  const own = new Map();
  for (const d of days) {
    const i = dayIndex(d.start, period.start);
    if (i >= 0 && i < length) own.set(i, d);
  }
  let acc = sumBins({}, days[0], 0);
  const points = [{ x: 0, v: usageValue(provider, key, acc) }];
  for (let i = 0; i < length && own.has(i); i++) {
    const d = own.get(i);
    acc = sumBins({ ...acc }, d);
    const next = new Date(d.start * 1000);
    next.setDate(next.getDate() + 1);
    const end = +next / 1000;
    const running = nowSec < end;
    points.push({ x: running ? i + Math.max(0, (nowSec - d.start) / (end - d.start)) : i + 1, v: usageValue(provider, key, acc) });
    if (running) break;
  }
  return { points, length, total: points.at(-1).v };
}

/// The curve's value at `x`, straight between its midnights.
function valueAt(curve, x) {
  const pts = curve.points;
  for (let i = 1; i < pts.length; i++) {
    if (x > pts[i].x) continue;
    const a = pts[i - 1], b = pts[i];
    if (a.v == null || b.v == null) return b.v ?? a.v;
    return a.v + (b.v - a.v) * ((x - a.x) / (b.x - a.x || 1));
  }
  return pts.at(-1).v;
}

/// "+18%", or "+3 pts" for a rate. Empty when there is nothing fair to compare.
function change(fmt, now, before) {
  if (now == null || before == null) return "";
  const sign = (n) => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n);
  if (fmt === "pct") return sign(Math.round((now - before) * 100)) + " pts";
  if (!before) return "";
  return sign(Math.round((now / before - 1) * 100)) + "%";
}

function periodName(per, start, long) {
  const date = new Date(start * 1000);
  if (per === "month") return date.toLocaleDateString("en", long ? { month: "long", year: "numeric" } : { month: "short" });
  if (!long) return "W" + isoWeek(date);
  const sunday = new Date(date);
  sunday.setDate(sunday.getDate() + 6);
  const md = (x) => x.toLocaleDateString("en", { month: "short", day: "numeric" });
  return `Week ${isoWeek(date)}, ${md(date)} to ${md(sunday)}`;
}

/// Everything the view draws, worked out once per refresh or choice.
function historyModel() {
  const h = state.history, d = state.data;
  if (!PROVIDERS[h.provider]) h.provider = "claude";
  if (!quantityOf(h.provider, h.key)) h.key = HISTORY_TWIN[h.key] && quantityOf(h.provider, HISTORY_TWIN[h.key]) ? HISTORY_TWIN[h.key] : "cost";
  if (!HISTORY_UNITS[h.per]) h.per = "week";
  if (h.view !== "overlay") h.view = "bars";
  const unit = HISTORY_UNITS[h.per];
  const [, quantity, fmt] = quantityOf(h.provider, h.key);
  const all = d?.[h.provider]?.[unit.list] || [];
  const days = d?.[h.provider]?.days || [];
  const nowSec = (d?.ts || Date.now()) / 1000;

  // From the first period the history knows anything about.
  const first = all.findIndex((p) => p.tracked);
  const periods = first < 0 ? [] : all.slice(first).map((p, i, list) => {
    const value = p.tracked ? usageValue(h.provider, h.key, p) : null;
    const complete = p.tracked && !p.partial;
    return {
      start: p.start, tracked: !!p.tracked, partial: !!p.partial, complete, value, current: i === list.length - 1,
      floor: value != null && fmt !== "pct" && (p.partial || (h.key === "cost" && p.unpricedTokens > 0)),
      curve: complete ? runningCurve(h.provider, h.key, p, h.per, days, nowSec) : null,
    };
  });
  periods.forEach((p, i) => {
    const prev = periods[i - 1];
    p.change = !p.current && prev?.complete && p.tracked ? change(fmt, p.value, prev.value) : "";
  });
  const cur = periods.at(-1) || null;
  const last = periods.length > 1 ? periods.at(-2) : null;
  const prior = periods.filter((p) => !p.current && p.complete && p.value != null);
  const shapes = prior.filter((p) => p.curve);
  const xNow = cur?.curve ? cur.curve.points.at(-1).x : null;
  const at = (p) => valueAt(p.curve, Math.min(xNow, p.curve.length));
  return {
    h, unit, quantity, fmt, periods, cur, last, prior, shapes, xNow, nowSec,
    avg: mean(prior.map((p) => p.value)),
    lastByNow: last?.complete && last.curve && xNow != null ? at(last) : null,
    typicalByNow: shapes.length && xNow != null ? mean(shapes.map(at)) : null,
    // This period so far, plus what the earlier ones went on to add from the
    // same point. A rate has no "rest of the period" to add.
    projection: fmt !== "pct" && cur?.value != null && shapes.length && xNow != null
      ? cur.value + mean(shapes.map((p) => Math.max(0, p.curve.total - at(p)))) : null,
    since: d?.history?.since?.[h.provider] || null,
    accent: state.config?.cards?.find((c) => c.id === h.provider)?.accent || HISTORY_ACCENT[h.provider],
  };
}

const svgEl = (markup, width, height, label) =>
  `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(label)}">${markup}</svg>`;

function barsChart(m, width) {
  const H = 104, top = 10, bottom = 15, plot = H - top - bottom;
  const ps = m.periods, n = Math.max(ps.length, 1);
  const slot = width / n, bw = Math.min(26, Math.max(3, slot * 0.64));
  const max = Math.max(...ps.map((p) => p.value || 0), m.projection || 0, m.avg || 0, 1e-9);
  const y = (v) => top + plot - (v / max) * plot;
  let out = `<line x1="0" x2="${width}" y1="${top + plot + 0.5}" y2="${top + plot + 0.5}" stroke="var(--hair)"/>`;
  ps.forEach((p, i) => {
    const cx = slot * i + slot / 2, x = (cx - bw / 2).toFixed(2), v = p.value || 0;
    const cls = "hbar" + (p.current ? " cur" : "") + (p.partial ? " partial" : "");
    out += `<g class="${cls}" data-i="${i}"><rect x="${slot * i}" y="0" width="${slot}" height="${H}" fill="transparent"/>`;
    if (v > 0) out += `<rect class="b" x="${x}" y="${y(v).toFixed(2)}" width="${bw.toFixed(2)}" height="${Math.max(1.5, top + plot - y(v)).toFixed(2)}" rx="1.5"/>`;
    if (p.current && m.projection > v) {
      out += `<rect x="${x}" y="${y(m.projection).toFixed(2)}" width="${bw.toFixed(2)}" height="${(y(v) - y(m.projection)).toFixed(2)}" rx="1.5" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 2" opacity="0.75"/>`;
    }
    const name = periodName(m.h.per, p.start);
    const label = m.h.per === "week" && slot < 24 ? name.slice(1) : name;
    out += `<text x="${cx}" y="${H - 3}" text-anchor="middle"${p.current ? ' class="cur"' : ""}>${label}</text></g>`;
  });
  if (m.avg != null && m.prior.length > 1) {
    const ay = y(m.avg).toFixed(2);
    out += `<line x1="0" x2="${width}" y1="${ay}" y2="${ay}" class="havg" style="pointer-events:none"/>`;
    out += `<text x="1" y="${(y(m.avg) - 3).toFixed(2)}" style="pointer-events:none">avg</text>`;
  }
  return svgEl(out, width, H, `${m.quantity} by ${m.unit.one}`);
}

function overlayChart(m, width) {
  const H = 112, top = 8, bottom = 15, plot = H - top - bottom;
  const curves = [...m.shapes, m.cur].filter((p) => p?.curve);
  const L = Math.max(m.h.per === "week" ? 7 : 28, ...curves.map((p) => p.curve.length));
  const avgPts = [];
  if (m.shapes.length > 1) {
    for (let x = 0; x <= L; x++) avgPts.push({ x, v: mean(m.shapes.map((p) => valueAt(p.curve, Math.min(x, p.curve.length)))) });
  }
  const max = Math.max(...curves.flatMap((p) => p.curve.points.map((pt) => pt.v || 0)), ...avgPts.map((pt) => pt.v || 0), 1e-9);
  const sx = (x) => (x / L) * width, sy = (v) => top + plot - (v / max) * plot;
  const path = (pts) => pts.filter((pt) => pt.v != null).map((pt, i) => (i ? "L" : "M") + sx(pt.x).toFixed(2) + " " + sy(pt.v).toFixed(2)).join("");
  let out = `<line x1="0" x2="${width}" y1="${top + plot + 0.5}" y2="${top + plot + 0.5}" stroke="var(--hair)"/>`;
  // A faint rule at each midnight for a week, each Monday-length stretch for a month.
  for (let x = m.h.per === "week" ? 1 : 7; x < L; x += m.h.per === "week" ? 1 : 7) {
    out += `<line x1="${sx(x).toFixed(2)}" x2="${sx(x).toFixed(2)}" y1="${top}" y2="${top + plot}" stroke="var(--hair)" stroke-dasharray="1 3"/>`;
  }
  if (m.h.per === "week") WEEKDAYS.forEach((d, i) => { out += `<text x="${sx(i + 0.5).toFixed(2)}" y="${H - 3}" text-anchor="middle">${d}</text>`; });
  else for (const day of [1, 8, 15, 22, 29]) if (day <= L) out += `<text x="${sx(day - 0.5).toFixed(2)}" y="${H - 3}" text-anchor="middle">${day}</text>`;
  const index = (p) => m.periods.indexOf(p);
  for (const p of m.shapes) if (p !== m.last) out += `<path class="hline" data-i="${index(p)}" d="${path(p.curve.points)}"/>`;
  if (avgPts.length) out += `<path class="havg" d="${path(avgPts)}"/>`;
  if (m.last?.curve && m.shapes.includes(m.last)) out += `<path class="hline last" data-i="${index(m.last)}" d="${path(m.last.curve.points)}"/>`;
  if (m.cur?.curve) {
    const end = m.cur.curve.points.at(-1);
    out += `<line x1="${sx(end.x).toFixed(2)}" x2="${sx(end.x).toFixed(2)}" y1="${top}" y2="${top + plot}" stroke="var(--accent)" opacity="0.3"/>`;
    out += `<path class="hline cur" data-i="${index(m.cur)}" d="${path(m.cur.curve.points)}"/>`;
    if (end.v != null) out += `<circle cx="${sx(end.x).toFixed(2)}" cy="${sy(end.v).toFixed(2)}" r="2.6" fill="var(--accent)"/>`;
  }
  out += `<line class="hcross" x1="0" x2="0" y1="${top}" y2="${top + plot}" stroke="var(--text)" opacity="0" stroke-width="0.6"/>`;
  out += `<rect class="hhit" x="0" y="0" width="${width}" height="${H}" fill="transparent"/>`;
  m.overlay = { sx, L, avgPts };
  return svgEl(out, width, H, `${m.quantity}, running total by ${m.h.per === "week" ? "weekday" : "day of the month"}`);
}

/// The line over the chart: the hovered period or day, otherwise the one under way.
function historyReadout(m, hover) {
  const f = (v) => FMT[m.fmt](v);
  // The overlay's line is short enough for a narrow panel: "End of Wed: this
  // $412 · last $380 · avg $350".
  const lines = (when, mine, theirs, avg) => [
    `${when}: this ${mine}`,
    theirs != null && m.last?.curve && m.shapes.includes(m.last) ? `last ${f(theirs)}` : null,
    avg != null ? `avg ${f(avg)}` : null,
  ].filter(Boolean).join(" · ");
  if (m.h.view === "overlay" && hover?.x != null) {
    const x = hover.x;
    const mine = !m.cur?.curve ? "—" : x <= Math.ceil(m.xNow) ? f(valueAt(m.cur.curve, Math.min(x, m.xNow))) + (x > m.xNow ? " so far" : "") : "not yet";
    return lines(m.h.per === "week" ? `End of ${WEEKDAYS[x - 1]}` : `Day ${x}`, mine,
      m.last?.curve ? valueAt(m.last.curve, Math.min(x, m.last.curve.length)) : null,
      m.overlay?.avgPts.length ? valueAt({ points: m.overlay.avgPts }, x) : null);
  }
  const i = hover?.i ?? m.periods.length - 1;
  const p = m.periods[i];
  if (!p) return "";
  if (m.h.view === "overlay" && hover?.i == null) {
    return lines("By now", f(m.cur?.value), m.lastByNow, m.shapes.length > 1 ? m.typicalByNow : null);
  }
  const value = p.tracked ? f(p.value) + (p.floor ? "+" : "") : "no data";
  const prev = m.periods[i - 1];
  const vs = p.change ? ` · ${p.change} vs ${periodName(m.h.per, prev.start)}` : "";
  return `${periodName(m.h.per, p.start, true)} · ${value}${p.current ? " so far" : ""}${vs}`;
}

function setHistoryHover(hover) {
  const m = state.history.model;
  if (!m) return;
  state.history.hover = hover;
  const host = $("history");
  const i = hover?.i;
  host.querySelectorAll(".hbar, .hlist .mrow, .hline").forEach((n) => n.classList.toggle("hot", i != null && n.dataset.i === String(i)));
  const cross = host.querySelector(".hcross");
  if (cross) {
    const x = hover?.x != null ? m.overlay.sx(hover.x).toFixed(2) : 0;
    cross.setAttribute("x1", x);
    cross.setAttribute("x2", x);
    cross.setAttribute("opacity", hover?.x != null ? "0.35" : "0");
  }
  host.querySelector(".hreadout").textContent = historyReadout(m, hover);
}

function renderHistory() {
  const host = $("history");
  if (!state.history.open || !state.data || state.data.error) return;
  const m = historyModel();
  const h = m.h;
  state.history.model = m;
  host.style.setProperty("--accent", m.accent);
  host.replaceChildren();
  const commit = (change) => { Object.assign(h, change, { hover: null }); rememberHistory(); renderHistory(); };

  const seg = (options, current, onPick, label) => {
    const box = el("div", "seg");
    box.setAttribute("role", "group");
    box.setAttribute("aria-label", label);
    for (const [value, text] of options) {
      const b = el("button", value === current ? "sel" : null, text);
      b.setAttribute("aria-pressed", String(value === current));
      b.onclick = () => onPick(value);
      box.append(b);
    }
    return box;
  };

  // Which provider, which quantity, weeks or months.
  const head = el("div", "hhead");
  const back = el("button", "hback");
  back.title = "Back to the panel (Esc)";
  back.setAttribute("aria-label", "Back to the panel");
  back.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>';
  back.onclick = closeHistory;
  head.append(back);
  const used = (p) => ["weeks", "months"].some((l) => (state.data[p]?.[l] || []).some((x) => x.tracked && x.tokens > 0));
  const providers = Object.keys(PROVIDERS).filter((p) => p === h.provider || used(p));
  if (providers.length > 1) {
    head.append(seg(providers.map((p) => [p, PROVIDERS[p]]), h.provider, (p) => {
      commit({ provider: p, key: quantityOf(p, h.key) ? h.key : HISTORY_TWIN[h.key] && quantityOf(p, HISTORY_TWIN[h.key]) ? HISTORY_TWIN[h.key] : "cost" });
    }, "Provider"));
  } else {
    head.append(el("span", "dot"), el("span", "cname", PROVIDERS[h.provider]));
  }
  head.append(picker(QUANTITIES[h.provider].map(([k, label]) => [k, label]), h.key, (k) => commit({ key: k }), "What each period shows"));
  head.append(el("span", "spacer"), seg(Object.entries(HISTORY_UNITS).map(([k, u]) => [k, u.label]), h.per, (per) => commit({ per }), "Weeks or months"));
  host.append(head);

  if (!m.periods.length) {
    host.append(el("div", "hempty", `No ${m.unit.one} in the usage history has any ${PROVIDERS[h.provider]} usage yet.`));
    reportHeight();
    return;
  }

  // This period, the last one and a typical one, then how this one is pacing.
  const f = (v) => FMT[m.fmt](v);
  const sum = el("div", "hsum");
  const fig = (value, caption, big, title) => {
    const box = el("div", "hfig");
    box.append(el("span", big ? "big" : "hmid", value), el("span", "bigsub", caption));
    if (title) box.title = title;
    sum.append(box);
  };
  fig(f(m.cur.value) + (m.cur.floor ? "+" : ""), `this ${m.unit.one}`, true, periodName(h.per, m.cur.start, true) + ", so far");
  if (m.last) fig(m.last.tracked ? f(m.last.value) + (m.last.floor ? "+" : "") : "—", `last ${m.unit.one}`, false,
    periodName(h.per, m.last.start, true) + (m.last.partial ? ". " + historyPartial(m.unit.one) : ""));
  if (m.avg != null && m.prior.length > 1) fig(f(m.avg), `avg of ${m.prior.length} ${m.unit.plural}`, false,
    `The average of the last ${m.prior.length} complete ${m.unit.plural} in the history, this one left out.`);
  sum.append(seg([["bars", "Bars"], ["overlay", "Overlay"]], h.view, (view) => commit({ view }), "Chart"));
  host.append(sum);

  const pace = el("div", "hpace");
  const vsLast = change(m.fmt, m.cur.value, m.lastByNow);
  if (vsLast) {
    pace.append(el("b", null, vsLast), document.createTextNode(` vs last ${m.unit.one} at this point`));
    pace.title = `Last ${m.unit.one} had reached ${f(m.lastByNow)} by the same point.`;
  }
  if (m.projection != null) {
    if (vsLast) pace.append(document.createTextNode(" · "));
    pace.append(document.createTextNode("on track for "), el("b", null, "≈" + f(m.projection)));
    pace.title = (pace.title ? pace.title + "\n" : "") + `On track: this ${m.unit.one} so far, plus what the last ${m.shapes.length} complete ${m.shapes.length === 1 ? m.unit.one : m.unit.plural} added from this point on, on average.`;
  }
  if (pace.childNodes.length) host.append(pace);

  // The chart: one bar per period, or the periods laid over each other.
  host.append(el("div", "hreadout"));
  const chart = el("div", "hchart");
  host.append(chart);
  const width = Math.max(200, Math.floor(chart.getBoundingClientRect().width) || 330);
  if (h.view === "overlay" && !m.cur.curve) {
    chart.append(el("div", "hempty", "The overlay needs the daily totals the collector now sends; they arrive with the next refresh."));
  } else if (h.view === "overlay") {
    chart.innerHTML = overlayChart(m, width);
    const legend = el("div", "hlegend");
    const item = (cls, text) => { const s = el("span"); s.append(el("i", cls), document.createTextNode(text)); legend.append(s); };
    item("", `this ${m.unit.one}`);
    if (m.last?.curve && m.shapes.includes(m.last)) item("last", `last ${m.unit.one}`);
    if (m.overlay.avgPts.length) item("avg", `avg of ${m.shapes.length} ${m.unit.plural}`);
    if (m.shapes.filter((p) => p !== m.last).length) item("older", `earlier ${m.unit.plural}`);
    host.append(legend);
    const hit = chart.querySelector(".hhit");
    hit.addEventListener("mousemove", (e) => {
      const r = hit.getBoundingClientRect();
      const x = Math.min(m.overlay.L, Math.max(1, Math.round(((e.clientX - r.left) / r.width) * m.overlay.L)));
      if (state.history.hover?.x !== x) setHistoryHover({ x });
    });
    hit.addEventListener("mouseleave", () => setHistoryHover(null));
  } else {
    chart.innerHTML = barsChart(m, width);
  }

  // Every period, newest first, with its change on the one before.
  const list = el("div", "mlist hlist");
  const max = Math.max(...m.periods.map((p) => p.value || 0), 1e-9);
  const thisYear = new Date().getFullYear();
  [...m.periods].reverse().forEach((p) => {
    const i = m.periods.indexOf(p);
    const row = el("div", "mrow" + (p.current ? " now" : "") + (p.partial ? " partial" : ""));
    row.dataset.i = i;
    const date = new Date(p.start * 1000);
    const name = el("span", "mmon", periodName(h.per, p.start));
    if (h.per === "week") name.append(el("small", null, date.toLocaleDateString("en", { month: "short", day: "numeric" })));
    else if (date.getFullYear() !== thisYear) name.append(el("small", null, "’" + String(date.getFullYear()).slice(2)));
    const track = el("span", "mtrack");
    const fill = el("i");
    fill.style.width = (p.value > 0 ? Math.max(2, (p.value / max) * 100) : 0) + "%";
    track.append(fill);
    const value = el("span", "mval", p.tracked ? f(p.value) + (p.floor ? "+" : "") : "—");
    const chg = el("span", "hchg", p.current ? "so far" : p.change);
    row.append(name, track, value, chg);
    row.title = historyReadout(m, { i }) + (p.partial ? ". " + historyPartial(m.unit.one) : "");
    list.append(row);
  });
  host.append(list);

  const notes = [];
  if (m.since) notes.push(`Kept on this Mac since ${new Date(m.since * 1000).toLocaleDateString("en", { month: "short", day: "numeric", year: "numeric" })}.`);
  if (m.periods.some((p) => p.floor)) notes.push("A + marks a lower bound: the period began before the history, or holds usage without a published price.");
  if (h.provider === "codex" && h.key === "cost") notes.push("Codex cost is an estimate at published API prices, not your bill.");
  if (notes.length) host.append(el("div", "hnote", notes.join(" ")));

  // Hovering a bar, a line or a row names that period over the chart.
  host.querySelectorAll(".hbar, .hlist .mrow, .hline").forEach((n) => {
    n.addEventListener("mouseenter", () => setHistoryHover({ i: Number(n.dataset.i) }));
    n.addEventListener("mouseleave", () => setHistoryHover(null));
  });
  setHistoryHover(state.history.hover);
  reportHeight();
}

window.hudOpenHistory = (focus) => openHistory(focus || {});

// ===================================================================== theme

let mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
mediaQuery.addEventListener("change", () => applyTheme());

function applyTheme() {
  const t = (state.config && state.config.theme) || {};
  const root = document.documentElement;
  const scheme = t.scheme === "auto" || !t.scheme ? (mediaQuery.matches ? "dark" : "light") : t.scheme;
  root.dataset.scheme = scheme;
  root.dataset.density = t.density || "normal";
  // Editing always draws the whole layout - you cannot move what is not on
  // screen - so minimised is suspended rather than fought with in CSS. The
  // history view suspends it the same way.
  root.dataset.collapsed = t.collapsed && !state.customizing && !state.history.open ? "1" : "0";
  root.style.setProperty("--preview-width", (t.width || 380) + "px");
  root.dataset.cmode = t.collapsedMode || "bars";
  root.style.setProperty("--radius", (t.radius != null ? t.radius : 14) + "px");
  // Opacity is the panel's own darkness, not the window's alpha. The vibrancy
  // view samples the desktop, so over a bright wallpaper the raw material reads
  // white; the fix is to control how much dark veil sits on top of it, never to
  // fade the whole window (which only lets more of that bright desktop through).
  // The slider's 40-100% maps onto a veil that stays translucent at the bottom
  // and goes nearly solid at the top, so the top can never wash out to white.
  const op = t.opacity == null ? 1 : Math.max(0.4, Math.min(1, t.opacity));
  const x = (op - 0.4) / 0.6;                       // 0 at 40%, 1 at 100%
  const a = (0.22 + 0.70 * x).toFixed(3);           // 0.22 .. 0.92
  const veil = scheme === "light" ? `rgba(244, 245, 248, ${a})` : `rgba(16, 16, 18, ${a})`;
  root.style.setProperty("--veil", veil);
  $("b-collapse").classList.toggle("on", !!t.collapsed);
  syncLivePreview();
  reportHeight();
}

/// Window-level properties live in AppKit, not CSS - push them across as they
/// change so a slider drag feels immediate instead of waiting for a save.
function pushTheme() {
  bridge({ action: "theme", theme: state.config.theme });
}

// ====================================================================== data

function applyData() {
  if (!state.data || state.data.error) return;
  for (const u of updaters) {
    try { u(state.data); } catch (e) { /* one bad widget must not blank the panel */ }
  }
  fitHeaders();
  tickAge();
  syncLivePreview();
  reportHeight();
}

/// Header items sit side by side on one baseline while they fit. When a narrow
/// panel runs out of room, flex would shrink them and break a caption in two,
/// lifting one number above the other; instead the header goes "tight" and every
/// caption moves under its number. Measured, because CSS cannot compare the
/// available width with what the numbers happen to need today.
function fitHeaders(root = document) {
  for (const rh of root.querySelectorAll(".rh")) {
    rh.classList.remove("tight");
    const headlines = [...rh.querySelectorAll(".headline")];
    if (headlines.some((h) => h.scrollWidth > h.clientWidth + 1)) rh.classList.add("tight");
  }
}
window.addEventListener("resize", () => { fitHeaders(); if (state.history.open) renderHistory(); reportHeight(); });

function tickAge() {
  if (!state.data || state.data.error) return;
  const age = Math.max(0, Math.floor((Date.now() - state.data.ts) / 1000));
  $("age").textContent = age < 5 ? "just now" : FMT.dur(age) + " ago";
}

let lastHeight = 0;
function reportHeight() {
  const h = Math.ceil($("root").getBoundingClientRect().height);
  if (h && h !== lastHeight) {
    lastHeight = h;
    bridge({ action: "height", value: h });
  }
}

// ====================================================================== save

let saveTimer = null;
let savedSnapshot = null;
function updateSaveStatus() {
  $("save-status").textContent = state.savePending ? "Saving changes…" : "Changes saved automatically";
  $("b-undo").disabled = !state.undo.length;
}
function flushSave() {
  clearTimeout(saveTimer);
  bridge({ action: "saveConfig", config: state.config });
  state.savePending = false;
  updateSaveStatus();
}
function save() {
  const snapshot = JSON.stringify(state.config);
  if (savedSnapshot && snapshot !== savedSnapshot) {
    state.undo.push(savedSnapshot);
    state.undo = state.undo.slice(-30);
  }
  syncLivePreview();
  savedSnapshot = snapshot;
  state.savePending = true;
  updateSaveStatus();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 350);
}
$("b-undo").onclick = () => {
  if (!state.undo.length) return;
  state.config = JSON.parse(state.undo.pop());
  savedSnapshot = JSON.stringify(state.config);
  state.selected = null;
  applyTheme(); pushTheme(); buildLayout();
  if (state.drawer) buildDrawer();
  flushSave();
};

// ================================================================== entry in

window.hudUpdate = (payload) => {
  $("b-refresh").classList.remove("spin");

  if (payload.error) {
    state.data = payload;
    $("err").textContent = payload.error;
    $("err").classList.add("on");
    reportHeight();
    return;
  }
  $("err").classList.remove("on");

  const incoming = payload.config;
  const first = !state.config;
  // Never let a scheduled refresh overwrite edits that are still in flight.
  const adopt = incoming && !state.customizing && !state.savePending &&
    JSON.stringify(incoming) !== JSON.stringify(state.config);

  state.data = payload;
  if (first || adopt) {
    state.config = incoming;
    savedSnapshot = JSON.stringify(incoming);
    state.undo = [];
    applyTheme();
    buildLayout();
    if (state.drawer) buildDrawer();
  } else {
    applyData();
  }
  if (state.history.open) renderHistory();
};
window.hudBusy = () => $("b-refresh").classList.add("spin");

// The native window and browser previews share these entry points.
window.hudSetEditing = (on) => setEditing(!!on);
window.hudOpenDrawer = () => openCustomization("appearance");
window.hudOpenSaved = () => openCustomization("saved");
window.hudApplySavedConfig = (name) => applySavedConfig(name);
window.hudSavedConfigs = (list) => {
  state.saved = Array.isArray(list) ? list.filter((s) => s && typeof s.name === "string") : [];
  if (state.customizing && state.tab === "saved") buildSaved();
};
window.hudSetBounds = ({ height }) => {
  document.documentElement.style.setProperty("--available-height", Math.max(160, height) + "px");
  reportHeight();
};
function openCustomization(tab = "layout") {
  if (!state.config) return;
  closeHistory();
  const entering = !state.customizing;
  state.customizing = true;
  tab = ["appearance", "saved"].includes(tab) ? tab : "layout";
  state.tab = tab;
  state.editing = tab === "layout";
  state.drawer = tab !== "layout";
  document.body.classList.add("customizing");
  document.body.classList.toggle("editing", state.editing);
  document.body.dataset.tab = tab;
  $("drawer").classList.toggle("open", state.drawer);
  document.querySelectorAll("#custom-tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === tab)));
  $("workspace-note").textContent = {
    layout: "Select a component to edit. Drag the grip to reorder.",
    appearance: "Tune the look, size and behavior of your HUD.",
    saved: "Keep layouts under a name and switch between them.",
  }[tab];
  if (entering) bridge({ action: "editing", value: true });
  applyTheme(); buildLayout();
  if (state.drawer) buildDrawer();
  updateSaveStatus();
  reportHeight();
}
function setEditing(on) {
  if (drag) endDrag();
  if (on) return openCustomization("layout");
  if (!state.config) return;
  state.customizing = state.editing = state.drawer = false;
  document.body.classList.remove("customizing", "editing");
  $("drawer").classList.remove("open");
  flushSave();
  bridge({ action: "editing", value: false });
  applyTheme(); buildLayout(); reportHeight();
  $("b-edit").focus({ preventScroll: true });
}
$("b-refresh").onclick = () => { $("b-refresh").classList.add("spin"); bridge({ action: "refresh" }); };
$("b-hide").onclick = () => bridge({ action: "hide" });
$("b-edit").onclick = () => openCustomization("layout");
$("b-drawer").onclick = () => openCustomization("appearance");
$("b-done").onclick = () => setEditing(false);
$("b-history").onclick = () => (state.history.open ? closeHistory() : openHistory());
document.querySelectorAll("#custom-tabs button").forEach(b => b.onclick = () => openCustomization(b.dataset.tab));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.customizing && !e.defaultPrevented) {
    e.preventDefault(); setEditing(false);
  } else if (e.key === "Escape" && state.history.open && !e.defaultPrevented) {
    e.preventDefault(); closeHistory();
  }
});
new ResizeObserver(reportHeight).observe($("root"));

$("b-collapse").onclick = () => {
  const t = state.config.theme;
  // From the history, minimising means back to the panel, minimised.
  t.collapsed = state.history.open || !t.collapsed;
  closeHistory();
  applyTheme();
  save();
};

// Drag the window from any inert surface. Controls and the row grips opt out.
// A big number, sparkline or history list opens its history on a click, and
// still moves the panel once the mouse travels before it is let go.
let pressed = null;
document.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  if (e.target.closest("button, select, input, .grip") || (state.customizing && !e.target.closest("#custom-head"))) return;
  const wrap = !state.customizing && e.target.closest("#cards .wrap[data-history]");
  if (wrap) { pressed = { wrap, x: e.clientX, y: e.clientY }; return; }
  bridge({ action: "drag" });
});
window.addEventListener("mousemove", (e) => {
  if (!pressed) return;
  if (!(e.buttons & 1)) { pressed = null; return; }
  if (Math.hypot(e.clientX - pressed.x, e.clientY - pressed.y) > 3) { pressed = null; bridge({ action: "drag" }); }
});
window.addEventListener("mouseup", () => {
  if (!pressed) return;
  const { wrap } = pressed;
  pressed = null;
  if (wrap.isConnected) openHistory(historyFocus(wrap.__spec, wrap.__ctx?.card));
});

// Exposed for the test harness and for poking at things in a debugger.
window.hudState = state;

setInterval(() => { tickAge(); applyData(); }, 1000);
bridge({ action: "ready" });
reportHeight();
</script>
